<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CppTube</title>
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='22' y='5' rx='6' fill='%23FF0000'/%3E%3Cpath d='M13 11 L13 21 L22 16 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg>
      </button>
      <a class="logo" href="#/">
        <svg class="logo-badge" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="22" y="5" rx="6" fill="#FF0000"/>
          <path d="M13 11 L13 21 L22 16 Z" fill="white"/>
        </svg>
        <span>CppTube<sup>IN</sup></span>
      </a>
    </div>

    <form class="searchbar" id="search-form" role="search">
      <input id="search-input" type="text" placeholder="Search" autocomplete="off" />
      <button class="search-btn" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59A6.94 6.94 0 0016.01 10a7 7 0 10-7 7 6.94 6.94 0 004.58-1.72l5.59 5.59.7-.7zM10 16a6 6 0 110-12 6 6 0 010 12z"/></svg>
      </button>
    </form>

    <div class="topbar-right">
      <a class="icon-btn" href="#/upload" title="Upload" aria-label="Upload">
        <svg viewBox="0 0 24 24"><path d="M14 13h-3v3H9.9v-3H7v-1h2.9V9H11v3h3v1zm3-3.5a3.5 3.5 0 000-7 3.5 3.5 0 00-3.45 3H2v1h11.55A3.5 3.5 0 0017 9.5z"/></svg>
        <span class="upload-label">Create</span>
      </a>
      <div class="avatar" title="You">Y</div>
    </div>
  </header>

  <!-- ===== Layout ===== -->
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a href="#/" class="nav-item active" data-route="home">
        <svg viewBox="0 0 24 24"><path d="M4 10v10h5v-6h6v6h5V10L12 3z"/></svg><span>Home</span>
      </a>
      <a href="#/upload" class="nav-item" data-route="upload">
        <svg viewBox="0 0 24 24"><path d="M14 13h-3v3H9.9v-3H7v-1h2.9V9H11v3h3v1zm3-3.5a3.5 3.5 0 000-7 3.5 3.5 0 00-3.45 3H2v1h11.55A3.5 3.5 0 0017 9.5z"/></svg><span>Create</span>
      </a>
      <div class="nav-sep"></div>
      <div class="nav-title">Explore</div>
      <a href="#/" class="nav-item" data-route="trending">
        <svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 8 8-11h-6l1-8z" transform="scale(.9) translate(1.5 1.5)"/></svg><span>Trending</span>
      </a>
      <div class="nav-sep"></div>
      <div class="nav-foot">Built in C++<br/>cpp-httplib & vanilla JS</div>
    </nav>

    <main class="content" id="content">
      <!-- routed views render here -->
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
